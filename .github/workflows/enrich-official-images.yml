name: Find missing official product photographs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    paths:
      - '.github/workflows/enrich-official-images.yml'
      - 'scripts/enrich-official-images.mjs'
      - 'data/catalog-products.json'
permissions:
  contents: write
concurrency:
  group: gastrosky-media-enrichment
  cancel-in-progress: true
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser
        run: npm ci || npm install --no-audit --no-fund
      - name: Match official supplier product photos
        run: node scripts/enrich-official-images.mjs
        env:
          PHOTO_CHECK_LIMIT: '1500'
      - name: Check additional exact-SKU product photographs
        run: npm run media:discover -- --limit=120 --apply
      - name: Summarize remaining missing photos
        run: npm run audit:images
      - name: Validate complete storefront
        run: npm run validate
      - name: Save verified image URLs and remaining coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-products.json data/image-coverage-report.json index.html
          git diff --cached --quiet || (git commit -m "Fill source-matched official GastroSky product photographs" && git pull --rebase origin main && git push)
