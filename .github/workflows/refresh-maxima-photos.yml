name: Refresh Maxima product photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-maxima-photos.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch image metadata for all Maxima SKUs
        run: node scripts/fetch-maxima-media.mjs
      - name: Commit collected photo URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/maxima-products.json index.html
          git diff --cached --quiet || (git commit -m "Refresh Maxima catalog image URLs" && git push)
