name: Check real catalog expansion candidates across six manufacturers
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-expansion-six-brands.mjs'
      - '.github/workflows/probe-expansion-six-brands.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install --no-audit --no-fund
      - run: node scripts/probe-expansion-six-brands.mjs
      - name: Save official source inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/six-brand-expansion-probe.json
          git diff --cached --quiet || (git commit -m "Record actual supplier product index structures" && git pull --rebase origin main && git push)
