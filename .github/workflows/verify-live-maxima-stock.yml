name: Verify real Maxima stock
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-live-maxima-stock.yml'
permissions:
  contents: read
jobs:
  one-real-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read real Maxima page and verify SKU
        run: node scripts/smoke-test-maxima-stock.mjs
