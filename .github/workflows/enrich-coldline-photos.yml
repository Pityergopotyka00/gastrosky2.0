name: Fill verified Coldline product photographs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/enrich-coldline-photos.mjs'
      - '.github/workflows/enrich-coldline-photos.yml'
permissions:
  contents: write
concurrency:
  group: gastrosky-supplier-media
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install --no-audit --no-fund
      - run: node scripts/enrich-coldline-photos.mjs
      - run: npm run validate
      - name: Save verified Coldline model images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-products.json index.html data/coldline-photo-match-report.json
          git diff --cached --quiet || (git commit -m "Import verified Coldline model photos" && git pull --rebase origin main && git push)
