name: Remove image notes and labels from GastroSky
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/remove-image-notes.mjs'
      - '.github/workflows/remove-image-notes.yml'
permissions:
  contents: write
concurrency:
  group: gastrosky-supplier-media
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install --no-audit --no-fund
      - name: Remove all image captions, labels, and badges
        run: node scripts/remove-image-notes.mjs
      - name: Validate public storefront and quote functionality
        run: npm run validate
      - name: Save clean site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Remove product-image note badges and captions" && git pull --rebase origin main && git push)
