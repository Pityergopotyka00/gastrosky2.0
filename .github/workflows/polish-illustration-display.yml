name: Finalize premium illustration presentation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/polish-illustration-display.mjs'
      - '.github/workflows/polish-illustration-display.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set storefront illustration layout
        run: node scripts/polish-illustration-display.mjs
      - name: Validate presentation
        run: npm run validate
      - name: Commit storefront display improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Fit premium illustrations in cards and product detail" && git pull --rebase origin main && git push)
