name: Discover public Maxima and HENDI products with photos
on:
  workflow_dispatch:
  schedule:
    - cron: '19 */2 * * *'
  push:
    paths:
      - 'scripts/discover-both-catalogs.mjs'
      - '.github/workflows/discover-both-catalogs.yml'
permissions:
  contents: write
concurrency:
  group: gastrosky-feed-sync
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Discover product pages and SKU-specific manufacturer images
        run: node scripts/discover-both-catalogs.mjs
        env:
          PUBLIC_DISCOVERY_PAGES: '100'
      - name: Validate catalog and website
        run: npm run validate
      - name: Commit imported products and crawl progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-products.json data/catalog-discovery-state.json
          git diff --cached --quiet || (git commit -m "Expand public Maxima and HENDI product catalogs with verified images" && git push)
