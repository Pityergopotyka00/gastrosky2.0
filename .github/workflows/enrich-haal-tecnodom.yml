name: Fill original Gastro Haal and Tecnodom photos
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/enrich-haalc-tecnodom.mjs'
      - '.github/workflows/enrich-haal-tecnodom.yml'
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install --no-audit --no-fund
      - run: node scripts/enrich-haalc-tecnodom.mjs
      - run: npm run validate
      - name: Commit and publish verified photo URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-products.json index.html data/haal-tecnodom-photo-report.json
          git diff --cached --quiet || (git commit -m "Fill official Gastro Haal and Tecnodom photos" && git pull --rebase origin main && git push)
