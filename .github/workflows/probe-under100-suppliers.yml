name: Scan under-101 manufacturer catalog sources
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-under100-suppliers.mjs'
      - '.github/workflows/probe-under100-suppliers.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install --no-audit --no-fund
      - run: node scripts/probe-under100-suppliers.mjs
      - name: Save manufacturer category diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/under100-supplier-probe.json
          git diff --cached --quiet || (git commit -m "Record official catalog sources for supplier expansion" && git pull --rebase origin main && git push)
