name: Expand Modular official model catalog to 101
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/expand-modular-from-model-pages.mjs'
      - '.github/workflows/expand-modular-to-101.yml'
permissions:
  contents: write
concurrency:
  group: gastrosky-supplier-media
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install --no-audit --no-fund
      - run: node scripts/expand-modular-from-model-pages.mjs
      - run: npm run validate
      - name: Save newly verified manufacturer model pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-products.json index.html data/modular-101-expansion-report.json
          git diff --cached --quiet || (git commit -m "Add official Modular models toward 101 verified entries" && git pull --rebase origin main && git push)
