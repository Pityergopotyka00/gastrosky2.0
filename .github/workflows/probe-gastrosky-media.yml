name: Inspect original GastroSky product photo markup
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-gastrosky-media.mjs'
      - '.github/workflows/probe-gastrosky-media.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install --no-audit --no-fund
      - run: node scripts/probe-gastrosky-media.mjs
      - name: Publish sanitized markup findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gastrosky-media-probe.json
          git diff --cached --quiet || (git commit -m "Record original GastroSky photo markup findings" && git pull --rebase origin main && git push)
