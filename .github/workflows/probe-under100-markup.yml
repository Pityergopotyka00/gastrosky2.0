name: Inspect product markup for under-101 catalogs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-under100-product-markup.mjs'
      - '.github/workflows/probe-under100-markup.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install --no-audit --no-fund
      - run: node scripts/probe-under100-product-markup.mjs
      - name: Save official site DOM evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/under100-markup-probe.json
          git diff --cached --quiet || (git commit -m "Document real supplier catalog product markup" && git pull --rebase origin main && git push)
