name: Refresh public supplier page availability
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-public-supplier-stock.yml'
      - 'scripts/check-public-supplier-stock.mjs'
  schedule:
    - cron: '43 */3 * * *'
permissions:
  contents: write
concurrency:
  group: gastrosky-feed-sync
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependency for parsers
        run: npm ci || npm install --no-audit --no-fund
      - name: Check public stock only where allowed by suppliers
        run: node scripts/check-public-supplier-stock.mjs
        env:
          PUBLIC_CHECK_LIMIT: '20'
      - name: Summarize stock-check results
        if: always()
        run: |
          node --input-type=module -e "import fs from 'node:fs';const s=JSON.parse(fs.readFileSync('data/supplier-stock-snapshot.json','utf8'));const values=Object.values(s);const verified=values.filter(x=>['in_stock','low_stock','out_of_stock'].includes(x.kind)).length;const reasons=Object.entries(values.reduce((a,v)=>(a[v.reason||'verified']=(a[v.reason||'verified']||0)+1,a),{}));console.log(JSON.stringify({records:values.length,verified,reasons},null,2))"
      - name: Commit public status evidence for worker snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/supplier-stock-snapshot.json
          git diff --cached --quiet || (git commit -m "Refresh publicly verifiable supplier availability" && git push)
