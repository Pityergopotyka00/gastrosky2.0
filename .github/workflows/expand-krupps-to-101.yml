name: Expand Krupps exact model catalog
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/expand-krupps-from-official-catalog.mjs'
      - '.github/workflows/expand-krupps-to-101.yml'
permissions:
  contents: write
concurrency:
  group: gastrosky-supplier-media
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install --no-audit --no-fund
      - run: node scripts/expand-krupps-from-official-catalog.mjs
      - run: npm run validate
      - name: Publish manufacturer verified Krupps machines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-products.json index.html data/krupps-101-expansion-report.json
          git diff --cached --quiet || (git commit -m "Import exact Krupps washing machine models" && git pull --rebase origin main && git push)
