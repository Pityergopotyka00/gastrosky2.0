name: Import authorized GastroSky manufacturer catalogs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gastrosky-feed-sync
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MAXIMA_FEED_URL: ${{ secrets.MAXIMA_FEED_URL }}
      HENDI_FEED_URL: ${{ secrets.HENDI_FEED_URL }}
      FAGOR_FEED_URL: ${{ secrets.FAGOR_FEED_URL }}
      MODULAR_FEED_URL: ${{ secrets.MODULAR_FEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install importer dependencies
        run: npm ci || npm install --no-audit --no-fund
      - name: Import products, images and verified stock
        run: node scripts/sync-supplier-feeds.mjs
      - name: Validate storefront and supplier catalog
        run: npm run validate
      - name: Report Maxima catalog progress
        run: |
          if [ -f data/maxima-import-report.json ]; then
            echo '## Maxima product import coverage' >> "$GITHUB_STEP_SUMMARY"
            echo 'Target: 216 or more real Maxima SKUs (200 more than the original 16).' >> "$GITHUB_STEP_SUMMARY"
            node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('data/maxima-import-report.json','utf8'));console.log('Current: '+r.maxima_products+' Maxima products, '+r.maxima_with_images+' photo links; '+r.maxima_missing_to_goal+' missing to target.')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit updated catalog and stock snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-products.json data/supplier-stock-snapshot.json data/maxima-import-report.json
          git diff --cached --quiet || (git commit -m "Import manufacturer products and photos from authorized files" && git push)
