name: Verify catalog and stock parser
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-catalog.yml'
      - 'worker/**'
      - 'tests/**'
      - 'package.json'
      - 'index.html'
      - 'data/catalog-products.json'
      - 'scripts/validate-site.mjs'
      - 'scripts/copy-static.mjs'
      - 'scripts/build-product-illustrations.mjs'
      - 'scripts/premium-product-illustrations.mjs'
      - 'scripts/build-illustration-showcase.mjs'
      - 'scripts/verify-product-visuals.mjs'
      - 'scripts/sync-supplier-feeds.mjs'
      - 'scripts/catalog-url.mjs'
      - 'scripts/discover-both-catalogs.mjs'
      - 'data/catalog-discovery-state.json'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check authorized supplier bulk importer syntax
        run: node --check scripts/sync-supplier-feeds.mjs
      - name: Run stock-parser and storefront tests
        run: npm test
      - name: Build deployable website
        run: npm run build
      - name: Verify all SVG visual assets are well formed
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('dist/media/product-illustrations').glob('*.svg'))
          assert len(files)==1044, len(files)
          for svg in files:
              content=svg.read_text()
              assert 'ILLUSZTRÁCIÓ' not in content and 'NEM GYÁRTÓI FOTÓ' not in content, svg.name
              root=ET.fromstring(content)
              assert root.tag.endswith('svg'), svg.name
          assert Path('dist/illusztracio-bemutato.html').exists()
          print('Validated',len(files),'machine illustrations as properly formed SVG')
          PY
      - name: Confirm all Maxima SKUs have image URLs
        run: |
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('data/maxima-products.json'));if(p.some(x=>!x.image_url))throw Error('Missing product image URL');console.log(p.length+' photo URLs present');"
