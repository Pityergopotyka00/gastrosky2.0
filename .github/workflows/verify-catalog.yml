name: Verify catalog and stock parser
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-catalog.yml'
      - 'worker/**'
      - 'tests/**'
      - 'package.json'
      - 'index.html'
      - 'data/catalog-products.json'
      - 'scripts/validate-site.mjs'
      - 'scripts/catalog-url.mjs'
      - 'scripts/discover-both-catalogs.mjs'
      - 'data/catalog-discovery-state.json'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run stock-parser and storefront tests
        run: npm test
      - name: Build deployable website
        run: npm run build
      - name: Confirm all Maxima SKUs have image URLs
        run: |
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('data/maxima-products.json'));if(p.some(x=>!x.image_url))throw Error('Missing product image URL');console.log(p.length+' photo URLs present');"
